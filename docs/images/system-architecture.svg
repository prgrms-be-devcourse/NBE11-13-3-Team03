<svg xmlns="http://www.w3.org/2000/svg" id="diagram" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Gudit — 시스템 아키텍처</title>
<desc id="diagram-desc">브라우저와 단일 Spring Boot 애플리케이션, PostgreSQL, Redis, Kakao OAuth2, Toss Payments, n8n의 논리적 시스템 관계를 나타낸다. Gudit 내부에 비즈니스 도메인 모듈과 Outbox Publisher, Streams Consumer가 함께 실행된다. 외부 API 요청과 Webhook, 문의 전달과 내부 상태 조회의 방향을 구분한다.</desc>
