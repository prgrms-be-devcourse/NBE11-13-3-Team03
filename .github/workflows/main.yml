name: PR CI

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      SPRING_DATA_REDIS_HOST: localhost
      SPRING_DATA_REDIS_PORT: '6379'

    steps:
      - name: Checkout PR merge commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v6

      # Uses src/test/resources/application.yml (H2 and dummy OAuth/JWT values).
      # k6 scripts and the performance profile are not invoked by this task.
      - name: Compile and run unit and integration tests
        run: bash ./gradlew test --no-daemon --stacktrace --console=plain

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/reports/tests/test/
            build/test-results/test/*.xml
            build/reports/problems/
          if-no-files-found: warn
          retention-days: 7
